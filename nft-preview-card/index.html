<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>Frontend Mentor | NFT Preview Card</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
</head>
<body>
  <main>
    <div id="component">
      <div class="nft-image-container">
        <img
          src="assets/images/image-equilibrium.jpg"
          alt="Equilibrium"
          width="604"
          height="604"
          class="nft-image"
        />
        <div class="nft-image-overlay">
          <img
            src="assets/images/icon-view.svg"
            width="48"
            height="48"
            alt="View icon"
          />
        </div>
      </div>
      <h1>Equilibrium #3429</h1>
      <p>Our Equilibrium collection promotes balance and calm.</p>
      <div class="stats">
        <div class="stat stat-eth">
          <img
            src="assets/images/icon-ethereum.svg"
            width="11"
            height="18"
            alt="Ethereum icon"
          />
          0.041 ETH
        </div>
        <div class="stat stat-eta">
          <img
            src="assets/images/icon-clock.svg"
            width="17"
            height="17"
            alt="Clock icon"
          />
          3 days left
        </div>
      </div>
      <hr class="rule" />
      <div class="creation">
        <img
          src="assets/images/image-avatar.png"
          alt="Jules Wyvern"
          width="132"
          height="132"
          class="creator-image"
        />
        <div>Creation of <span class="creator-name">Jules Wyvern</span></div>
      </div>
    </div>
  </main>
</body>
</html>
